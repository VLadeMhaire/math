    <script>
        // Lesson 7 content - Finding Antiderivatives
        const lesson7Pages = [
            {
                bookTitle: "Finding Antiderivatives",
                title: "Introduction to Antiderivatives",
                content: `<h3>What is an Antiderivative?</h3>
                <p>An <strong>antiderivative</strong> of a function f(x) is a function F(x) whose derivative is f(x):</p>
                <div class="formula">F'(x) = f(x)</div>
                
                <div class="math-example">
                    <h3>Simple Example</h3>
                    <p>If f(x) = 2x, then an antiderivative is F(x) = x² because:</p>
                    <div class="formula">d/dx [x²] = 2x</div>
                    <p>But also F(x) = x² + 1, x² - 3, x² + π... all work!</p>
                </div>
                
                <h3>The Constant of Integration</h3>
                <p>Since the derivative of a constant is zero, antiderivatives come in families:</p>
                <div class="formula">If F'(x) = f(x), then [F(x) + C]' = f(x) for any constant C</div>
                
                <div class="math-example">
                    <h3>Indefinite Integral Notation</h3>
                    <div class="formula">∫ f(x) dx = F(x) + C</div>
                    <p>∫ is the integral sign, f(x) is the integrand, dx indicates the variable, and C is the constant of integration.</p>
                </div>
                
                <h3>Basic Integration Rules (Reverse Power Rule)</h3>
                <div class="formula">∫ xⁿ dx = xⁿ⁺¹/(n+1) + C, for n ≠ -1</div>
                
                <h3>Verification by Differentiation</h3>
                <p>Always check your antiderivative by differentiating:</p>
                <div class="formula">d/dx [xⁿ⁺¹/(n+1) + C] = xⁿ ✓</div>
                
                <h3>Initial Value Problems</h3>
                <p>Sometimes we know F(a) = b (an initial condition). This lets us find the specific constant C.</p>`
            },
            {
                title: "Example 1: Polynomial Integration",
                content: `<h3>Problem:</h3>
                <p>Find ∫ (4x³ - 3x² + 5x - 2) dx</p>
                
                <div class="math-example">
                    <h3>Step 1 — Apply the power rule term by term</h3>
                    <p>The integral of a sum is the sum of integrals:</p>
                    <div class="formula">∫ (4x³ - 3x² + 5x - 2) dx = ∫4x³ dx - ∫3x² dx + ∫5x dx - ∫2 dx</div>
                </div>
                
                <div class="math-example">
                    <h3>Step 2 — Integrate each term</h3>
                    <p>For ∫4x³ dx: n = 3, so n+1 = 4, coefficient 4 ÷ 4 = 1:</p>
                    <div class="formula">∫4x³ dx = 4 × (x⁴/4) + C₁ = x⁴ + C₁</div>
                    
                    <p>For ∫3x² dx: n = 2, so n+1 = 3, coefficient 3 ÷ 3 = 1:</p>
                    <div class="formula">∫3x² dx = 3 × (x³/3) + C₂ = x³ + C₂</div>
                    
                    <p>For ∫5x dx: n = 1, so n+1 = 2, coefficient 5 ÷ 2 = 5/2:</p>
                    <div class="formula">∫5x dx = 5 × (x²/2) + C₃ = (5/2)x² + C₃</div>
                    
                    <p>For ∫2 dx: Note 2 = 2x⁰, n = 0, so n+1 = 1:</p>
                    <div class="formula">∫2 dx = 2 × (x¹/1) + C₄ = 2x + C₄</div>
                </div>
                
                <div class="math-example">
                    <h3>Step 3 — Combine terms</h3>
                    <p>Putting it all together:</p>
                    <div class="formula">∫ (4x³ - 3x² + 5x - 2) dx = x⁴ - x³ + (5/2)x² - 2x + C</div>
                    <p>Note: C₁ - C₂ + C₃ - C₄ = just one constant C</p>
                </div>
                
                <div class="math-example">
                    <h3>Step 4 — Verify by differentiation</h3>
                    <div class="formula">d/dx [x⁴ - x³ + (5/2)x² - 2x + C]<br>
                    = 4x³ - 3x² + 5x - 2 + 0</div>
                    <p>✓ Matches the original integrand!</p>
                </div>
                
                <h3>General Approach</h3>
                <p>1. Integrate term by term<br>
                2. Add 1 to the exponent, then divide by new exponent<br>
                3. Combine constants into one +C<br>
                4. Always check by differentiating</p>
                
                <div class="math-example">
                    <h3>Quick Pattern</h3>
                    <div class="formula">∫ axⁿ dx = a × [xⁿ⁺¹/(n+1)] + C</div>
                    <p>Add 1 to exponent, divide by new exponent, multiply by coefficient.</p>
                </div>`
            },
            {
                title: "Example 2: With Initial Condition",
                content: `<h3>Problem:</h3>
                <p>Find f(x) if f'(x) = 6x² - 4x + 3 and f(1) = 5.</p>
                
                <div class="math-example">
                    <h3>Step 1 — Find the general antiderivative</h3>
                    <div class="formula">∫ (6x² - 4x + 3) dx = 6(x³/3) - 4(x²/2) + 3x + C</div>
                    <p>Simplify:</p>
                    <div class="formula">= 2x³ - 2x² + 3x + C</div>
                    <p>So f(x) = 2x³ - 2x² + 3x + C</p>
                </div>
                
                <div class="math-example">
                    <h3>Step 2 — Use the initial condition f(1) = 5</h3>
                    <p>Substitute x = 1 into f(x):</p>
                    <div class="formula">f(1) = 2(1)³ - 2(1)² + 3(1) + C = 2 - 2 + 3 + C = 3 + C</div>
                    <p>We know f(1) = 5, so:</p>
                    <div class="formula">3 + C = 5</div>
                    <div class="formula">C = 2</div>
                </div>
                
                <div class="math-example">
                    <h3>Step 3 — Write the specific solution</h3>
                    <div class="formula">f(x) = 2x³ - 2x² + 3x + 2</div>
                </div>
                
                <div class="math-example">
                    <h3>Step 4 — Verify both conditions</h3>
                    <p>Check derivative:</p>
                    <div class="formula">f'(x) = 6x² - 4x + 3 ✓</div>
                    <p>Check initial condition:</p>
                    <div class="formula">f(1) = 2(1) - 2(1) + 3(1) + 2 = 2 - 2 + 3 + 2 = 5 ✓</div>
                </div>
                
                <h3>Geometric Interpretation</h3>
                <p>There are infinitely many curves with the same slope (derivative). The initial condition picks out the specific curve that passes through the point (1, 5).</p>
                
                <div class="math-example">
                    <h3>Family of Curves</h3>
                    <p>All functions of the form f(x) = 2x³ - 2x² + 3x + C have the same derivative.</p>
                    <p>The initial condition f(1) = 5 selects C = 2 from this family.</p>
                </div>`
            },
            {
                title: "Basic Integration Formulas",
                content: `<h3>Essential Antiderivative Formulas</h3>
                <p>Memorize these basic integration formulas:</p>
                
                <div class="math-example">
                    <h3>Power Rule (n ≠ -1)</h3>
                    <div class="formula">∫ xⁿ dx = xⁿ⁺¹/(n+1) + C</div>
                    <p>Examples:<br>
                    ∫ x⁵ dx = x⁶/6 + C<br>
                    ∫ √x dx = ∫ x¹/² dx = x³/²/(3/2) = (2/3)x³/² + C<br>
                    ∫ 1/x² dx = ∫ x⁻² dx = x⁻¹/(-1) = -1/x + C</p>
                </div>
                
                <div class="math-example">
                    <h3>Exponential Functions</h3>
                    <div class="formula">∫ eˣ dx = eˣ + C</div>
                    <div class="formula">∫ aˣ dx = aˣ/ln(a) + C, for a > 0, a ≠ 1</div>
                    <div class="formula">∫ eᵏˣ dx = (1/k)eᵏˣ + C</div>
                    <p>Examples:<br>
                    ∫ e³ˣ dx = (1/3)e³ˣ + C<br>
                    ∫ 2ˣ dx = 2ˣ/ln2 + C</p>
                </div>
                
                <div class="math-example">
                    <h3>Trigonometric Functions</h3>
                    <div class="formula">∫ sin x dx = -cos x + C</div>
                    <div class="formula">∫ cos x dx = sin x + C</div>
                    <div class="formula">∫ sec² x dx = tan x + C</div>
                    <div class="formula">∫ sec x tan x dx = sec x + C</div>
                    <div class="formula">∫ csc² x dx = -cot x + C</div>
                    <div class="formula">∫ csc x cot x dx = -csc x + C</div>
                </div>
                
                <div class="math-example">
                    <h3>Special Case: n = -1</h3>
                    <div class="formula">∫ 1/x dx = ln|x| + C</div>
                    <p>Note the absolute value! This works for positive and negative x.</p>
                </div>
                
                <h3>Linearity Properties</h3>
                <div class="formula">∫ [af(x) + bg(x)] dx = a∫ f(x) dx + b∫ g(x) dx</div>
                <p>Constants can be factored out, and integrals split over sums/differences.</p>
                
                <h3>Example Combining Rules</h3>
                <p>∫ (3eˣ + 4cos x - 5/x) dx</p>
                <div class="formula">= 3∫ eˣ dx + 4∫ cos x dx - 5∫ 1/x dx<br>
                = 3eˣ + 4sin x - 5ln|x| + C</div>`
            },
            {
                title: "Integration of Trigonometric Functions",
                content: `<h3>Trigonometric Integration Basics</h3>
                <p>These come from reversing derivative formulas:</p>
                
                <div class="math-example">
                    <h3>Derivative → Antiderivative</h3>
                    <table style="width:100%; border-collapse: collapse; margin: 15px 0;">
                        <tr style="background: #e8f4ff;">
                            <th style="padding: 8px; text-align: left;">Derivative Rule</th>
                            <th style="padding: 8px; text-align: left;">Antiderivative Rule</th>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">d/dx [sin x] = cos x</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">∫ cos x dx = sin x + C</td>
                        </tr>
                        <tr style="background: #f9f9f9;">
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">d/dx [cos x] = -sin x</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">∫ sin x dx = -cos x + C</td>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">d/dx [tan x] = sec² x</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">∫ sec² x dx = tan x + C</td>
                        </tr>
                        <tr style="background: #f9f9f9;">
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">d/dx [sec x] = sec x tan x</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">∫ sec x tan x dx = sec x + C</td>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">d/dx [cot x] = -csc² x</td>
                            <td style="padding: 8px; border-bottom: 1px solid #ddd;">∫ csc² x dx = -cot x + C</td>
                        </tr>
                        <tr style="background: #f9f9f9;">
                            <td style="padding: 8px;">d/dx [csc x] = -csc x cot x</td>
                            <td style="padding: 8px;">∫ csc x cot x dx = -csc x + C</td>
                        </tr>
                    </table>
                </div>
                
                <h3>Example 1: Mixed Trigonometric Function</h3>
                <p>∫ (2sin x - 3cos x + sec² x) dx</p>
                
                <div class="math-example">
                    <h3>Solution</h3>
                    <div class="formula">= 2∫ sin x dx - 3∫ cos x dx + ∫ sec² x dx<br>
                    = 2(-cos x) - 3(sin x) + tan x + C<br>
                    = -2cos x - 3sin x + tan x + C</div>
                </div>
                
                <h3>Example 2: With Coefficients on Arguments</h3>
                <p>∫ sin(3x) dx</p>
                
                <div class="math-example">
                    <h3>Solution</h3>
                    <p>We know d/dx [cos(3x)] = -3sin(3x).<br>
                    So d/dx [-⅓cos(3x)] = sin(3x).</p>
                    <div class="formula">∫ sin(3x) dx = -⅓cos(3x) + C</div>
                </div>
                
                <div class="math-example">
                    <h3>General Rule for sin(kx) and cos(kx)</h3>
                    <div class="formula">∫ sin(kx) dx = -(1/k)cos(kx) + C</div>
                    <div class="formula">∫ cos(kx) dx = (1/k)sin(kx) + C</div>
                    <p>Always divide by the coefficient of x inside the trig function.</p>
                </div>
                
                <h3>Verification Example</h3>
                <p>Check: ∫ cos(4x) dx = (1/4)sin(4x) + C</p>
                <div class="formula">d/dx [(1/4)sin(4x) + C] = (1/4)×4cos(4x) = cos(4x) ✓</div>
                
                <h3>Common Mistake</h3>
                <p>∫ sin(x²) dx ≠ -cos(x²) + C<br>
                Because d/dx [-cos(x²)] = 2x sin(x²) by chain rule.<br>
                For sin(kx), the argument must be linear in x.</p>`
            },
            {
                title: "Summary and Practice",
                content: `<h3>Basic Integration Rules Summary</h3>
                <div class="math-example">
                    <p><strong>Power Rule (n ≠ -1):</strong> ∫ xⁿ dx = xⁿ⁺¹/(n+1) + C</p>
                    <p><strong>Special Case (n = -1):</strong> ∫ 1/x dx = ln|x| + C</p>
                    <p><strong>Exponential:</strong> ∫ eˣ dx = eˣ + C</p>
                    <p><strong>Exponential with coefficient:</strong> ∫ eᵏˣ dx = (1/k)eᵏˣ + C</p>
                    <p><strong>Sine:</strong> ∫ sin x dx = -cos x + C</p>
                    <p><strong>Cosine:</strong> ∫ cos x dx = sin x + C</p>
                </div>
                
                <h3>Linearity Property</h3>
                <div class="formula">∫ [af(x) + bg(x)] dx = a∫ f(x) dx + b∫ g(x) dx</div>
                
                <h3>Try It Yourself</h3>
                <div class="math-example">
                    <p><strong>Practice Problem 1:</strong><br>
                    Find ∫ (x⁴ - 3x² + 2/x) dx</p>
                    <p><em>Hint: Write 2/x as 2x⁻¹</em></p>
                </div>
                
                <div class="math-example">
                    <p><strong>Practice Problem 2:</strong><br>
                    Find ∫ (e²ˣ - 5sin x + 4cos(2x)) dx</p>
                    <p><em>Remember: ∫ cos(kx) dx = (1/k)sin(kx) + C</em></p>
                </div>
                
                <div class="math-example">
                    <p><strong>Practice Problem 3:</strong><br>
                    Find f(x) if f'(x) = 4x³ + eˣ and f(0) = 3</p>
                </div>
                
                <h3>Verification Strategy</h3>
                <p>Always check your antiderivative by differentiating:</p>
                <div class="math-example">
                    <p>If you find ∫ f(x) dx = F(x) + C,<br>
                    then compute dF/dx.<br>
                    It should equal f(x).</p>
                </div>
                
                <h3>Common Errors to Avoid</h3>
                <p>1. Forgetting +C in indefinite integrals<br>
                2. Applying power rule to 1/x (use ln|x| instead)<br>
                3. Misapplying chain rule in reverse<br>
                4. Forgetting to divide by coefficient in ∫ sin(kx) or ∫ cos(kx)<br>
                5. Not checking your answer by differentiation</p>
                
                <h3>Next Steps</h3>
                <p>Once you master these basic rules, you'll be ready for:<br>
                • Substitution method (u-sub)<br>
                • Integration by parts<br>
                • Trigonometric substitution<br>
                • Partial fractions</p>
                
                <p>Practice is key! Try integrating different combinations of these basic functions.</p>`
            }
        ];

        // Initialize the book with Lesson 7 content
        document.addEventListener('DOMContentLoaded', function() {
            initBook(lesson7Pages);
        });
